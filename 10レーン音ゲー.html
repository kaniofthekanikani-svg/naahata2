<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10レーン音ゲー</title>
<style>
:root{--bg:#120c1f;--fg:#f4ecff;--tap:#4de1ff;--hold:#ff5fb8;--chord:#ffd24a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;height:100%;max-width:720px;margin:0 auto}
canvas{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(18,12,31,.92);text-align:center;padding:24px}
h1{margin:0;font-size:30px;letter-spacing:.04em}
p{margin:0;line-height:1.7;font-size:15px;opacity:.9}
button{font:inherit;font-size:18px;font-weight:700;padding:12px 40px;border:0;border-radius:999px;background:var(--tap);color:#07121a;cursor:pointer}
#md{background:transparent;color:var(--fg);border:2px solid var(--fg);font-size:15px;padding:8px 24px}
button:focus-visible{outline:3px solid var(--chord);outline-offset:3px}
.k{color:var(--tap)}.h{color:var(--hold)}.c{color:var(--chord)}
</style></head><body>
<div id="wrap"><canvas id="cv"></canvas>
<div id="ov"><h1>10レーン音ゲー</h1>
<p><span class="k">水色</span>＝単押し　<span class="h">ピンク</span>＝長押し（離さない）　<span class="c">金色</span>＝同時押し</p>
<p>キーボード：A S D F G H J K L ;（左から1〜10レーン）<br>スマホ：レーンを直接タップ（マルチタッチOK）<br>128レーンはタップ/クリック専用（±2レーンの誤差まで判定）</p>
<button id="md">モード：10レーン</button><button id="go">スタート</button></div></div>
<script>
let N=10,mode128=false;const KEYS="asdfghjkl;".split(""),BPM=120,STEP=60/BPM/2,STEPS=240,LEAD=2,FALL=1.5;
const cv=document.getElementById("cv"),g=cv.getContext("2d"),ov=document.getElementById("ov");
let W,H;
function rs(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener("resize",rs);rs();

let ac,t0,notes=[],keys=Array(N).fill(false),sc,combo,maxCombo,cnt,total,flash=[],jd=null,timer,nextStep,running=false,noiseBuf;
const now=()=>ac.currentTime-t0;

function gen(){
  notes=[];const busy=Array(N).fill(-1);let id=0;
  for(let s=0;s<STEPS;s++){
    if(Math.random()<(s%2?.7:.25))continue;
    const free=[...Array(N).keys()].filter(l=>busy[l]<s);
    if(!free.length)continue;
    const pick=()=>free.splice(Math.random()*free.length|0,1)[0],t=LEAD+s*STEP,r=Math.random();
    if(r<.2){const l=pick(),len=2+(Math.random()*4|0);notes.push({l,t,d:len*STEP,k:"h"});busy[l]=s+len+1}
    else if(r<.4&&free.length>1){id++;notes.push({l:pick(),t,d:0,k:"c",id},{l:pick(),t,d:0,k:"c",id})}
    else notes.push({l:pick(),t,d:0,k:"t"});
  }
  total=notes.filter(n=>!n.id||true).length;
}
function tone(f,t,d,type,v){const o=ac.createOscillator(),q=ac.createGain();o.type=type;o.frequency.value=f;q.gain.setValueAtTime(v,t);q.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(q).connect(ac.destination);o.start(t);o.stop(t+d)}
function kick(t){const o=ac.createOscillator(),q=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);q.gain.setValueAtTime(.7,t);q.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(q).connect(ac.destination);o.start(t);o.stop(t+.25)}
function nz(t,d,v,hp){const s=ac.createBufferSource(),q=ac.createGain(),f=ac.createBiquadFilter();s.buffer=noiseBuf;f.type="highpass";f.frequency.value=hp;q.gain.setValueAtTime(v,t);q.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(q).connect(ac.destination);s.start(t);s.stop(t+d)}
const BASS=[110,87.3,130.8,98],CH=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]];
function music(s){
  const t=t0+s*STEP,b=(s>>3)%4;
  if(s%4==0)kick(t);
  if(s%8==4)nz(t,.15,.25,1500);
  nz(t,.04,s%2?.12:.06,7000);
  if(s%2==0)tone(BASS[b],t,.2,"sawtooth",.12);
  tone(CH[b][s%3]*2,t,.18,"triangle",.1);
}
function sched(){
  while(nextStep<STEPS+LEAD/STEP+8&&t0+nextStep*STEP<ac.currentTime+.25)music(nextStep++);
  if(now()>LEAD+STEPS*STEP+1.5)finish();
}
function start(){
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  ac.resume();N=mode128?128:10;keys=Array(N).fill(false);gen();sc=0;combo=0;maxCombo=0;cnt={p:0,g:0,m:0};flash=Array(N).fill(0);jd=null;
  t0=ac.currentTime+.2;nextStep=0;running=true;ov.style.display="none";timer=setInterval(sched,40);
}
function finish(){
  running=false;clearInterval(timer);
  const acc=(cnt.p+cnt.g*.5)/total*100,gr=acc>=95?"S":acc>=85?"A":acc>=70?"B":"C";
  ov.innerHTML=`<h1>結果 ${gr}</h1><p>スコア ${sc}<br>最大コンボ ${maxCombo}<br>PERFECT ${cnt.p} / GOOD ${cnt.g} / MISS ${cnt.m}<br>精度 ${acc.toFixed(1)}%</p><button id="md">モード：${mode128?128:10}レーン</button><button id="go">もう一度</button>`;
  ov.style.display="flex";document.getElementById("go").onclick=start;
}
document.getElementById("go").onclick=start;
ov.addEventListener("click",e=>{if(e.target.id=="md"){mode128=!mode128;e.target.textContent="モード："+(mode128?128:10)+"レーン"}});
const tol=()=>N>10?2:0;
function judge(txt,col){jd={txt,col,t:performance.now()}}
function bad(){combo=0;cnt.m++;judge("MISS","#ff6b6b")}
function press(l){
  if(!running)return;keys[l]=true;flash[l]=1;
  const n0=now();let best=null,bd=.15;
  for(const n of notes)if(Math.abs(n.l-l)<=tol()&&!n.hit&&!n.miss){const d=Math.abs(n.t-n0);if(d<bd){bd=d;best=n}}
  if(!best)return;
  best.hit=true;
  if(bd<.06){sc+=300;cnt.p++;judge("PERFECT","#4de1ff")}else{sc+=100;cnt.g++;judge("GOOD","#9dff8a")}
  combo++;maxCombo=Math.max(maxCombo,combo);
  if(best.k=="h")best.hold=true;else best.done=true;
  tone(best.k=="h"?660:880,ac.currentTime,.06,"square",.08);
}
function release(l){
  keys[l]=false;if(!running)return;
  for(const n of notes)if(Math.abs(n.l-l)<=tol()&&n.hold){n.hold=false;if(now()<n.t+n.d-.1){n.miss=true;bad()}else n.done=true}
}
addEventListener("keydown",e=>{const l=KEYS.indexOf(e.key.toLowerCase());if(N==10&&l>=0&&!e.repeat)press(l)});
addEventListener("keyup",e=>{const l=KEYS.indexOf(e.key.toLowerCase());if(N==10&&l>=0)release(l)});
const ptr={};
cv.addEventListener("pointerdown",e=>{const l=Math.min(N-1,Math.floor(e.offsetX/(W/N)));ptr[e.pointerId]=l;cv.setPointerCapture(e.pointerId);press(l)});
const up=e=>{if(ptr[e.pointerId]!=null){release(ptr[e.pointerId]);delete ptr[e.pointerId]}};
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);

function frame(){
  g.clearRect(0,0,W,H);const lw=W/N,J=H*.82;
  for(let i=0;i<N;i++){g.fillStyle=i%2?"#1a122c":"#150f26";g.fillRect(i*lw,0,lw,H);
    if(keys[i]){g.fillStyle="rgba(77,225,255,.22)";g.fillRect(i*lw,0,lw,H)}}
  g.fillStyle="rgba(255,255,255,.08)";for(let i=1;i<N;i+=N>10?8:1)g.fillRect(i*lw-.5,0,1,H);
  g.fillStyle="#f4ecff";g.fillRect(0,J,W,3);
  g.textAlign="center";g.font="600 13px system-ui";
  for(let i=0;N==10&&i<N;i++){g.fillStyle=keys[i]?"#4de1ff":"rgba(244,236,255,.55)";g.fillText(KEYS[i].toUpperCase(),i*lw+lw/2,J+(H-J)/2+4)}
  if(running){
    const n0=now(),yo=t=>J-(t-n0)/FALL*J;
    for(const n of notes){
      if(!n.miss&&!n.hit&&n0>n.t+.15){n.miss=true;bad()}
      if(n.hold&&n0>=n.t+n.d){n.hold=false;n.done=true;sc+=200}
      if(n.done&&n.d==0||n0>n.t+n.d+.3&&!n.hold)continue;
      const y=yo(n.t),y2=yo(n.t+n.d),pd=N>10?.4:3,x=n.l*lw+pd,w=lw-pd*2;
      if(y<-20||y2>H)continue;
      const col=n.k=="h"?"#ff5fb8":n.k=="c"?"#ffd24a":"#4de1ff";
      g.globalAlpha=n.miss?.25:1;
      if(n.k=="h"){g.fillStyle=n.hold?"rgba(255,95,184,.85)":"rgba(255,95,184,.45)";g.fillRect(x+w*.2,Math.max(0,y2),w*.6,(n.hold?J:y)-Math.max(0,y2))}
      g.fillStyle=col;g.fillRect(x,n.hold?J-7:y-7,w,14);
      g.globalAlpha=1;
    }
    for(const id of new Set(notes.filter(n=>n.id).map(n=>n.id))){
      const p=notes.filter(n=>n.id==id);if(p[0].hit||p[1].hit||p[0].miss)continue;
      const y=yo(p[0].t);if(y<0||y>H)continue;g.fillStyle="#ffd24a";const a=Math.min(p[0].l,p[1].l),b=Math.max(p[0].l,p[1].l);
      g.fillRect(a*lw+lw/2,y-2,(b-a)*lw,4);
    }
    g.fillStyle="#f4ecff";g.textAlign="left";g.font="700 20px system-ui";g.fillText(String(sc).padStart(6,"0"),12,28);
    g.textAlign="center";
    if(combo>1){g.font="800 34px system-ui";g.fillText(combo,W/2,H*.38);g.font="600 13px system-ui";g.fillText("COMBO",W/2,H*.38+20)}
    if(jd&&performance.now()-jd.t<500){g.font="800 22px system-ui";g.fillStyle=jd.col;g.fillText(jd.txt,W/2,H*.5)}
  }
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
